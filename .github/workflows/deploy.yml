name: Vocalize GCP Zero-Downtime Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  REPOSITORY: vocalize-repo
  BACKEND_SERVICE: vocalize-backend
  FRONTEND_SERVICE: vocalize-frontend

jobs:
  deploy-to-gcp:
    name: Build & Deploy to Google Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        if: env.GCP_PROJECT_ID != ''
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # Build & Push Backend Container
      - name: Build & Push Backend Image
        if: env.GCP_PROJECT_ID != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}

      # Zero-downtime rolling release on Cloud Run
      - name: Deploy Backend to Cloud Run
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          region: ${{ env.GAR_LOCATION }}
          env_vars: |
            NODE_ENV=production
            PORT=3001
            MAX_FILE_SIZE_MB=50
            UPLOAD_DIR=uploads
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          flags: '--allow-unauthenticated --cpu=2 --memory=2Gi --min-instances=1 --max-instances=10'
